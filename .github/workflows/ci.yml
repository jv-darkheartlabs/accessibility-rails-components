name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
      - run: bundle install
      - run: bundle exec rspec
      - name: Verify Render build commands
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ci-build-placeholder-not-a-production-secret
          DATABASE_PATH: /tmp/accessibility-demo-ci.sqlite3
        run: bundle exec rails assets:precompile && bundle exec rails db:prepare
